<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verify your Edvora account</title>
  </head>
  <body style="background:#080d1a;color:#e8eaf0;font-family:Arial,sans-serif;margin:0;padding:32px 16px">
    <main style="background:#0d1432;border:1px solid #2a3158;margin:0 auto;max-width:520px;padding:32px">
      <h1 style="font-size:24px;margin:0 0 12px">Verify your Edvora account</h1>
      <p style="color:#a8b4d0;line-height:1.6;margin:0 0 24px">
        Enter this code in Edvora to confirm your email address:
      </p>
      <p style="background:#111a38;border:1px solid #665bd7;color:#ffffff;font-size:30px;font-weight:700;letter-spacing:6px;margin:0 0 24px;padding:18px;text-align:center">
        {{ .Token }}
      </p>
      <p style="color:#7d89a2;font-size:13px;line-height:1.5;margin:0">
        This code expires in one hour. If you did not create an Edvora account, you can ignore this email.
      </p>
    </main>
  </body>
</html>
