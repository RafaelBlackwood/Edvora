name: Sync university catalog

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: university-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and normalize ROR catalog
        env:
          ZENODO_API_KEY: ${{ secrets.ZENODO_API_KEY }}
        run: python scripts/sync_ror_catalog.py

      - name: Commit catalog changes
        run: |
          git config user.name "edvora-catalog-bot"
          git config user.email "edvora-catalog-bot@users.noreply.github.com"
          git add public/data/university-catalog
          if git diff --cached --quiet; then
            echo "Catalog already matches the latest ROR release."
          else
            git commit -m "Update global university catalog"
            git push
          fi
