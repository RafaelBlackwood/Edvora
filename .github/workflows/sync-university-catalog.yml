name: Sync university catalog

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: university-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and normalize ROR catalog
        env:
          ZENODO_API_KEY: ${{ secrets.ZENODO_API_KEY }}
        run: python scripts/sync_ror_catalog.py

      - name: Refresh U.S. IPEDS program offerings
        run: python scripts/sync_ipeds_program_index.py

      - name: Refresh official program catalogs
        run: |
          python scripts/sync_atsu_program_catalog.py --strict
          python scripts/sync_tum_program_catalog.py
          python scripts/sync_ut_austin_program_catalog.py
          python scripts/sync_utoronto_program_catalog.py --strict
          python scripts/build_program_search_index.py

      - name: Commit catalog changes
        run: |
          git config user.name "edvora-catalog-bot"
          git config user.email "edvora-catalog-bot@users.noreply.github.com"
          git add public/data/university-catalog public/data/program-catalog
          if git diff --cached --quiet; then
            echo "University and program catalogs already match the latest sources."
          else
            git commit -m "Update university and program catalogs"
            git push
          fi
